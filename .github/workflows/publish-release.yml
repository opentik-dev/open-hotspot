name: Build and publish release

on:
  push:
    tags:
      - 'v*-r*'

permissions:
  contents: write

env:
  OPENWRT_VERSION: 25.12.5
  OPENWRT_TARGET: ipq40xx/generic

jobs:
  release:
    name: Rebuild and publish APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run release checks
        run: |
          python3 -m unittest discover -s tests -v
          sh tests/test_shell_syntax.sh
          sh tests/test_quota.sh
          for test in tests/test_*.sh; do sh "$test"; done
      - name: Enforce physical acceptance gates
        run: sh tools/check-release-gates.sh
      - name: Restore OpenWrt SDK cache
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/openwrt-sdk
          key: openwrt-sdk-${{ env.OPENWRT_VERSION }}-${{ env.OPENWRT_TARGET }}-v1
      - name: Download and unpack target SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          index="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}/"
          mkdir -p "$RUNNER_TEMP/sdk-download" "$RUNNER_TEMP/openwrt-sdk"
          sdk_name="$(curl -fsSL "$index" | grep -oE 'openwrt-sdk-[^"]+\.tar\.zst' | head -n 1)"
          test -n "$sdk_name"
          curl -fL --retry 3 "$index$sdk_name" -o "$RUNNER_TEMP/sdk-download/$sdk_name"
          tar --zstd -xf "$RUNNER_TEMP/sdk-download/$sdk_name" -C "$RUNNER_TEMP/openwrt-sdk" --strip-components=1
      - name: Rebuild APK from source
        env:
          OPEN_HOTSPOT_SDK: ${{ runner.temp }}/openwrt-sdk
        run: sh tools/build-apk.sh
      - name: Verify tag, package version, and checksum
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^PKG_VERSION:=//p' starter-kit/Makefile)"
          release="$(sed -n 's/^PKG_RELEASE:=//p' starter-kit/Makefile)"
          expected="v${version}-r${release}"
          test "$GITHUB_REF_NAME" = "$expected"
          apk="dist/luci-app-open-hotspot-${version}-r${release}.apk"
          test -s "$apk"
          sha256sum "$apk" | tee "$RUNNER_TEMP/SHA256SUMS"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Open-HotSpot ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Built from commit `${{ github.sha }}` by the release workflow.

            Acceptance status: see `docs/release-acceptance-matrix.md` and `docs/release-gates.md`.
          files: |
            ${{ steps.metadata.outputs.apk }}
            ${{ runner.temp }}/SHA256SUMS
